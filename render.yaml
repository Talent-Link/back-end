services:

* name: talent-link-backend
  type: web
  env: node
  buildCommand: "yarn install && npx prisma generate"
  startCommand: "npx prisma generate && npx ts-node src/server.ts"
  envVars:

  * key: PORT
    value: "10000"
    healthCheckPath: "/"
    autoDeploy: true
    region: us-east-1
    scale:
    type: standard
    cpu: 512
    memory: 1024
    network:
    type: public
    ssl:
    type: automatic
    cache:
    static:
    maxAge: 3600
    api:
    maxAge: 600
    security:
    firewall:

    * allow: "0.0.0.0/0"
